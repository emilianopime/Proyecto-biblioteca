<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Control de Laboratorio</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <main class="login-wrapper">
        <div class="tema-esquina">
            <button type="button" class="btn-theme" id="theme-toggle" onclick="alternarTema()" aria-label="Cambiar a tema claro">
                <svg class="icono-luna" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icono-sol" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
        </div>

        <div class="login-header">
            <div class="brand-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </div>
            <div class="brand-text">
                <h1 class="brand-title">Control de Laboratorio</h1>
                <p class="brand-subtitle">Universidad Autónoma de Chihuahua</p>
            </div>
        </div>

        <form class="login-card" method="POST" action="/login" novalidate>
            <h2>Acceso del personal</h2>

            {% if error %}
                <div class="error-msg" role="alert">{{ error }}</div>
            {% endif %}

            <div class="field">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username or '' }}"
                    autocomplete="username"
                    autocapitalize="off"
                    spellcheck="false"
                    {% if not username %}autofocus{% endif %}
                    required
                >
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    {% if username %}autofocus{% endif %}
                    required
                >
            </div>

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <p class="login-footer">Sistema de monitoreo del laboratorio de la biblioteca</p>

    </main>

</body>
</html>
